name: Release 📦

# Builds the self-contained binary and the Docker image for every version tag (e.g. v1.0.0)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  POETRY_VERSION: "2.5.1"

jobs:
  build-release-pkg:
    name: Builds and publishes a self-contained package to the release
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the release and attach the binary
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check pyproject.toml
        run: make check-pyproject

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Install poetry
        run: python3 -m pip install poetry==${POETRY_VERSION}

      - name: Write version
        # The tag is vX.Y.Z, the package version is X.Y.Z
        run: ./scripts/insert-version-pyproject.sh "${GITHUB_REF_NAME#v}"

      - name: Install Python libraries
        run: poetry install

      - name: Build package
        run: |
          make pkg
          mv ./dist/main ./generic-k8s-webhook-linux-${GITHUB_REF_NAME}

      - name: Publish package
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: generic-k8s-webhook-linux-${{ github.ref_name }}
          # Release notes are categorised using .github/release.yml
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  build-and-publish-to-ghcr:
    name: Build and publish Docker 🐳 images to GitHub Container Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Push Docker images to GitHub Container Registry
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is only set for stable releases (flavor latest=auto)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=sha

      - name: Write version
        run: ./scripts/insert-version-pyproject.sh "${GITHUB_REF_NAME#v}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # `secrets.GITHUB_TOKEN` is generated automatically at the start of the run to identify the job.
          # See https://docs.github.com/en/actions/security-guides/automatic-token-authentication#about-the-github_token-secret
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
